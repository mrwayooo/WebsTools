<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebsTools Hub - 8 Tools Version</title>
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ecc71;
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #2b2d42;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: var(--card); width: 100%; max-width: 480px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); height: fit-content; }
        
        h1 { text-align: center; margin-bottom: 25px; color: var(--primary); letter-spacing: -1px; }

        /* Tabs Menu - ปรับเป็น 4 คอลัมน์เพื่อให้รองรับ 7 ปุ่มได้สวยงาม */
        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: #f1f3f5; padding: 6px; border-radius: 12px; margin-bottom: 25px; }
        
        .tab-btn { 
            padding: 10px 2px; text-align: center; cursor: pointer; border-radius: 8px; 
            font-size: 11px; font-weight: 700; color: #666; border: none; background: none; 
            transition: all 0.2s ease; 
        }

        .tab-btn:hover:not(.active) { background-color: #e9ecef; color: var(--primary); transform: translateY(-1px); }
        .tab-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        .tool-content { display: none; animation: fadeIn 0.3s ease; }
        .tool-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Inputs & Buttons */
        input { 
            width: 100%; padding: 14px; margin: 10px 0; border: 2px solid #edf2f4; 
            border-radius: 10px; box-sizing: border-box; outline: none; font-size: 15px;
            transition: all 0.2s ease;
        }
        input:hover { border-color: #ccd3f8; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1); }

        button { 
            width: 100%; padding: 14px; border: none; border-radius: 10px; 
            cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 15px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-main { background: var(--primary); color: white; box-shadow: 0 4px 6px rgba(67, 97, 238, 0.1); }
        .btn-main:hover { background: #3651d1; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(67, 97, 238, 0.2); }
        .btn-main:active { transform: translateY(0); }

        .btn-dl { background: var(--success); color: white; display: none; margin-top: 15px; }
        .btn-dl:hover { background: #219150; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(46, 204, 113, 0.2); }

        .btn-copy { background: #6c757d; color: white; margin-top: 10px; }
        .btn-copy:hover { background: #5a6268; transform: translateY(-2px); }

        /* Results Area */
        .result-box { text-align: center; margin-top: 20px; }
        .result-img { max-width: 100%; border-radius: 12px; border: 1px solid #eee; display: none; margin: 0 auto; transition: 0.3s; }
        .result-img:hover { transform: scale(1.02); }
        .result-img.avatar { border-radius: 50%; max-width: 160px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); } 

        .stylish-res { background: #f8f9fa; padding: 15px; border-radius: 12px; text-align: left; margin-top: 10px; border-left: 4px solid var(--primary); }
        .strength-bar { height: 8px; background: #eee; border-radius: 5px; margin: 15px 0 5px; overflow: hidden; }
        .strength-fill { height: 100%; width: 0%; transition: width 0.5s ease; }
        /* Theme Colors tool */
        .th-field { margin-top: 14px; }
        .th-field label { font-size: 13px; font-weight: 700; }
        .th-row { display: flex; gap: 8px; align-items: center; }
        .th-row input[type="color"] { width: 52px; height: 46px; padding: 3px; margin: 10px 0; flex: none; cursor: pointer; }
        .th-row input[type="text"] { flex: 1; min-width: 0; font-family: monospace; text-transform: uppercase; }
        .th-row button { width: auto; margin: 0; padding: 12px 14px; }
        .th-row input.invalid { border-color: #e74c3c; box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.1); }
        .th-msg { display: block; min-height: 16px; color: #e74c3c; font-size: 12px; }
        .th-status { min-height: 20px; margin: 8px 0 0; font-size: 13px; font-weight: 700; text-align: center; }
        .th-status.ok { color: #219150; }
        .th-status.err { color: #e74c3c; }
        #thOut { width: 100%; box-sizing: border-box; margin-top: 10px; padding: 12px; border: 2px solid #edf2f4; border-radius: 10px; font: 13px/1.5 monospace; resize: none; background: #f8f9fa; color: var(--text); }
        .th-preview { margin-top: 20px; padding: 18px; border: 2px solid var(--th-stroke, #3045AA); border-radius: 14px; background: var(--th-bg, #F4F6FE); transition: background 0.2s ease, border-color 0.2s ease; }
        .th-card { padding: 18px; text-align: center; border: 4px solid var(--th-stroke, #3045AA); border-radius: 12px; background: var(--th-main, #4361EE); transition: background 0.2s ease, border-color 0.2s ease; }
        .th-title { margin: 0 0 12px; font-size: 28px; line-height: 1.2; color: #fff; -webkit-text-stroke: 1.5px var(--th-text, #20243A); paint-order: stroke fill; }
        @supports not (-webkit-text-stroke: 1px #000) {
            .th-title { text-shadow: -1px -1px 0 var(--th-text), 1px -1px 0 var(--th-text), -1px 1px 0 var(--th-text), 1px 1px 0 var(--th-text); }
        }
        .th-chip { display: inline-block; padding: 6px 14px; border: 2px solid var(--th-stroke, #3045AA); border-radius: 20px; background: var(--th-bg, #F4F6FE); color: var(--th-text, #20243A); font-size: 13px; font-weight: 700; }
        .th-text { margin: 14px 0 0; font-size: 14px; color: var(--th-text, #20243A); }
        @media (max-width: 420px) { .container { padding: 20px; } .th-row button { padding: 12px 10px; } }
    </style>
</head>
<body>

<div class="container">
    <h1>WebsTools Hub</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab(this, 'qr')">QR</button>
        <button class="tab-btn" onclick="openTab(this, 'yt')">YT Thumb</button>
        <button class="tab-btn" onclick="openTab(this, 'yt-logo')">YT Logo</button>
        <button class="tab-btn" onclick="openTab(this, 'pass-gen')">PassGen</button>
        <button class="tab-btn" onclick="openTab(this, 'pass-check')">Strength</button>
        <button class="tab-btn" onclick="openTab(this, 'stylish')">Stylish</button>
        <button class="tab-btn" onclick="openTab(this, 'uuid')">UUID</button>
        <button class="tab-btn" onclick="openTab(this, 'theme')">Theme Colors</button>
    </div>

    <div id="qr" class="tool-content active">
        <input type="text" id="qrIn" placeholder="URL or Text for QR">
        <button class="btn-main" onclick="genQR()">Get QR Code</button>
        <div class="result-box">
            <img id="qrImg" class="result-img">
            <button id="dlQR" class="btn-dl" onclick="dlImg('qrImg', 'qr.png')">Download QR</button>
        </div>
    </div>

    <div id="yt" class="tool-content">
        <input type="text" id="ytIn" placeholder="Paste YouTube Video Link">
        <button class="btn-main" onclick="genYT()">Get Thumbnail</button>
        <div class="result-box">
            <img id="ytImg" class="result-img">
            <button id="dlYT" class="btn-dl" onclick="dlImg('ytImg', 'thumb.jpg')">Download Image</button>
        </div>
    </div>

    <div id="yt-logo" class="tool-content">
        <input type="text" id="logoIn" placeholder="Paste Channel Link or @Handle">
        <button class="btn-main" onclick="genYTLogo()">Get Channel Logo</button>
        <div class="result-box">
            <img id="logoImg" class="result-img avatar">
            <button id="dlLogo" class="btn-dl" onclick="dlImg('logoImg', 'channel_logo.jpg')">Download Logo</button>
        </div>
    </div>

    <div id="pass-gen" class="tool-content">
        <input type="text" id="pgOut" readonly placeholder="Result Password">
        <button class="btn-main" onclick="genPass()">Generate Password</button>
        <div style="font-size: 13px; margin-top: 15px; text-align: center;">
            Length: <input type="range" id="pLen" min="6" max="32" value="12" oninput="document.getElementById('lVal').innerText=this.value" style="width: 70%; vertical-align: middle;"> 
            <span id="lVal" style="font-weight:bold; color:var(--primary); margin-left: 10px;">12</span>
        </div>
    </div>

    <div id="pass-check" class="tool-content">
        <input type="password" id="psIn" placeholder="Check strength..." oninput="checkPS()">
        <div class="strength-bar"><div id="psFill" class="strength-fill"></div></div>
        <p id="psTxt" style="font-size: 14px; font-weight: bold; text-align: center; margin-top: 10px;"></p>
    </div>

    <div id="stylish" class="tool-content">
        <input type="text" id="stIn" placeholder="Type normal text..." oninput="genStylish()">
        <div class="stylish-res">
            <small style="color:#666">Upside Down:</small> <div id="stFlip" style="font-weight: bold; margin-bottom: 10px; word-break: break-all;">(Result)</div>
            <small style="color:#666">Bubble Text:</small> <div id="stBubb" style="font-weight: bold; word-break: break-all;">(Result)</div>
        </div>
    </div>

    <div id="uuid" class="tool-content">
        <input type="text" id="uuOut" readonly placeholder="Result UUID">
        <button class="btn-main" onclick="genUUID()">Generate UUID v4</button>
        <button class="btn-copy" onclick="copyU()">Copy to Clipboard</button>
    </div>

    <div id="theme" class="tool-content">
        <div id="thFields"></div>
        <button class="btn-main" id="thCopyAll">Copy All HEX Values</button>
        <textarea id="thOut" rows="4" readonly aria-label="All HEX values"></textarea>
        <p id="thStatus" class="th-status" role="status" aria-live="polite"></p>
        <div id="thPreview" class="th-preview">
            <div class="th-card">
                <h3 class="th-title">Theme Preview</h3>
                <span class="th-chip">Stroke + Background</span>
            </div>
            <p class="th-text">Sample text using the Text Stroke color on your Background.</p>
        </div>
    </div>
</div>

<script>
    // System: Tab Switcher
    function openTab(btn, id) {
        document.querySelectorAll('.tool-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    // Tools Logic
    function genQR() {
        const val = document.getElementById('qrIn').value;
        if(!val) return alert("Enter text!");
        const img = document.getElementById('qrImg');
        img.src = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(val)}`;
        img.style.display = "block";
        document.getElementById('dlQR').style.display = "block";
    }

    function genYT() {
        const url = document.getElementById('ytIn').value;
        let id = url.includes("v=") ? url.split("v=")[1].substring(0, 11) : url.split("be/")[1]?.substring(0, 11);
        if(!id) return alert("Invalid Link");
        const img = document.getElementById('ytImg');
        img.src = `https://img.youtube.com/vi/${id}/maxresdefault.jpg`;
        img.style.display = "block";
        document.getElementById('dlYT').style.display = "block";
    }

    // ฟังก์ชันแท็บใหม่: ดึงโลโก้ช่อง YouTube
    function genYTLogo() {
        const input = document.getElementById('logoIn').value.trim();
        const img = document.getElementById('logoImg');
        const dlBtn = document.getElementById('dlLogo');
        if(!input) return alert("Please enter handle or link");

        let handle = input;
        if(input.includes("youtube.com/")) {
            handle = input.split("youtube.com/")[1].replace('@', '');
        } else {
            handle = input.replace('@', '');
        }

        img.src = `https://unavatar.io/youtube/${handle}`;
        img.style.display = "block";
        dlBtn.style.display = "block";
    }

    async function dlImg(id, name) {
        try {
            const res = await fetch(document.getElementById(id).src);
            const blob = await res.blob();
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob); a.download = name; a.click();
        } catch(e) { alert("Error downloading. Right click image instead."); }
    }

    function genPass() {
        const len = document.getElementById('pLen').value;
        const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
        let res = "";
        for(let i=0; i<len; i++) res += charset.charAt(Math.floor(Math.random() * charset.length));
        document.getElementById('pgOut').value = res;
    }

    function checkPS() {
        const p = document.getElementById('psIn').value;
        const fill = document.getElementById('psFill');
        let s = 0;
        if(p.length > 8) s++; if(/[A-Z]/.test(p)) s++; if(/[0-9]/.test(p)) s++; if(/[^A-Za-z0-9]/.test(p)) s++;
        const colors = ["#ff4d4d", "#ffa64d", "#ffdb4d", "#2ecc71"];
        fill.style.width = p ? (s+1)*25 + "%" : "0%";
        fill.style.background = colors[s];
        document.getElementById('psTxt').innerText = p ? ["Weak", "Fair", "Good", "Strong"][s] : "";
        document.getElementById('psTxt').style.color = colors[s];
    }

    function genStylish() {
        const t = document.getElementById('stIn').value.toLowerCase();
        const flipM = {"a":"ɐ","b":"q","c":"ɔ","d":"p","e":"ǝ","f":"ɟ","g":"ƃ","h":"ɥ","i":"ᴉ","j":"ɾ","k":"ʞ","l":"l","m":"ɯ","n":"u","o":"o","p":"d","q":"b","r":"ɹ","s":"s","t":"ʇ","u":"n","v":"ʌ","w":"ʍ","x":"x","y":"ʎ","z":"z"};
        const bubbM = {"a":"ⓐ","b":"ⓑ","c":"ⓒ","d":"ⓓ","e":"ⓔ","f":"ⓕ","g":"ⓖ","h":"ⓗ","i":"ⓘ","j":"ⓙ","k":"ⓚ","l":"ⓛ","m":"ⓜ","n":"ⓝ","o":"ⓞ","p":"ⓟ","q":"ⓠ","r":"ⓡ","s":"ⓢ","t":"ⓣ","u":"ⓤ","v":"ⓥ","w":"ⓦ","x":"ⓧ","y":"ⓨ","z":"ⓩ"};
        document.getElementById('stFlip').innerText = t.split('').map(c => flipM[c] || c).reverse().join('') || "(Result)";
        document.getElementById('stBubb').innerText = t.split('').map(c => bubbM[c] || c).join('') || "(Result)";
    }

    function genUUID() {
        document.getElementById('uuOut').value = ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
    }

    function copyU() {
        const v = document.getElementById('uuOut').value;
        if(v) { navigator.clipboard.writeText(v); alert("UUID Copied!"); }
    }

    // Theme Colors tool (all logic runs locally in the browser)
    const TH_ROWS = [['main','Main Theme'], ['stroke','Stroke'], ['bg','Background'], ['text','Text Stroke']];
    const thState = {};
    let thTimer;

    function thNorm(v) { const m = /^#?([0-9a-f]{6})$/i.exec(String(v).trim()); return m ? '#' + m[1].toUpperCase() : null; }
    function thRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
    function thHex(r, g, b) { return '#' + [r, g, b].map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, '0')).join('').toUpperCase(); }
    function thToHsl(hex) {
        const [r, g, b] = thRgb(hex).map(v => v / 255);
        const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min, l = (max + min) / 2;
        let h = 0, s = 0;
        if (d) {
            s = d / (1 - Math.abs(2 * l - 1));
            h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
            h = (h * 60 + 360) % 360;
        }
        return [h, s, l];
    }
    function thFromHsl(h, s, l) {
        const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
        const i = Math.floor(h / 60) % 6;
        const [r, g, b] = [[c,x,0],[x,c,0],[0,c,x],[0,x,c],[x,0,c],[c,0,x]][i];
        return thHex((r + m) * 255, (g + m) * 255, (b + m) * 255);
    }
    function thLum(hex) {
        const [r, g, b] = thRgb(hex).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }
    function thContrast(a, b) { const x = thLum(a), y = thLum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }

    // Same hue family: stroke = darker (or lighter if main is very dark), background = pale tint,
    // text stroke = deep tone darkened until it reaches 7:1 contrast against the background.
    function thPalette(main) {
        const [h, s, l] = thToHsl(main);
        const stroke = l > 0.2 ? thFromHsl(h, s, Math.max(0.08, l - 0.22)) : thFromHsl(h, s, Math.min(0.9, l + 0.25));
        const bg = thFromHsl(h, Math.min(s, 0.85), 0.96);
        let tl = 0.17, text = thFromHsl(h, Math.min(s, 0.5), tl);
        while (thContrast(text, bg) < 7 && tl > 0.02) { tl -= 0.01; text = thFromHsl(h, Math.min(s, 0.5), tl); }
        return { stroke, bg, text };
    }

    function thStatus(msg, ok) {
        const el = document.getElementById('thStatus');
        el.textContent = msg; el.className = 'th-status ' + (ok ? 'ok' : 'err');
        clearTimeout(thTimer);
        if (ok) thTimer = setTimeout(() => { el.textContent = ''; }, 2500);
    }

    function thRender() {
        const pv = document.getElementById('thPreview');
        TH_ROWS.forEach(([k]) => pv.style.setProperty('--th-' + k, thState[k]));
        document.getElementById('thOut').value = TH_ROWS.map(([k, label]) => label + ': ' + thState[k]).join('\n');
    }

    function thApply(k, hex) {
        thState[k] = hex;
        const pick = document.getElementById('th-' + k + '-pick'), inp = document.getElementById('th-' + k + '-hex');
        pick.value = hex.toLowerCase(); inp.value = hex; inp.classList.remove('invalid');
        document.getElementById('th-' + k + '-msg').textContent = '';
    }

    function thSetMain(hex) {
        thApply('main', hex);
        const pal = thPalette(hex);
        thApply('stroke', pal.stroke); thApply('bg', pal.bg); thApply('text', pal.text);
        thRender();
    }

    function thSet(k, hex) {
        if (k === 'main') thSetMain(hex); else { thApply(k, hex); thRender(); }
    }

    function thCopy(text, srcEl, label) {
        const ok = () => thStatus(label + ' copied!', true);
        const legacy = () => {
            try { srcEl.focus(); srcEl.select(); if (document.execCommand('copy')) ok(); else fail(); } catch (e) { fail(); }
        };
        const fail = () => { try { srcEl.focus(); srcEl.select(); } catch (e) {} thStatus('Copy failed. The text is selected: press Ctrl+C (Cmd+C on Mac).', false); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, legacy);
        else legacy();
    }

    function thInit() {
        document.getElementById('thFields').innerHTML = TH_ROWS.map(([k, label]) =>
            `<div class="th-field"><label for="th-${k}-hex">${label}</label>
             <div class="th-row">
                <input type="color" id="th-${k}-pick" aria-label="${label} color picker">
                <input type="text" id="th-${k}-hex" maxlength="7" spellcheck="false" autocomplete="off">
                <button class="btn-copy" id="th-${k}-copy">Copy</button>
             </div>
             <small class="th-msg" id="th-${k}-msg" role="alert"></small></div>`).join('');

        TH_ROWS.forEach(([k, label]) => {
            const pick = document.getElementById('th-' + k + '-pick'), inp = document.getElementById('th-' + k + '-hex');
            pick.addEventListener('input', () => thSet(k, pick.value.toUpperCase()));
            inp.addEventListener('input', () => {
                const n = thNorm(inp.value);
                if (!n) {
                    inp.classList.add('invalid');
                    document.getElementById('th-' + k + '-msg').textContent = 'Enter a 6-digit HEX color, like #4361EE.';
                    return;
                }
                thSet(k, n);
            });
            inp.addEventListener('blur', () => { if (inp.classList.contains('invalid')) thApply(k, thState[k]); });
            document.getElementById('th-' + k + '-copy').addEventListener('click', () => {
                thApply(k, thState[k]); // restore any half-typed text so the selected text matches what is copied
                thCopy(thState[k], inp, label);
            });
        });
        document.getElementById('thCopyAll').addEventListener('click', () => {
            const out = document.getElementById('thOut');
            thCopy(out.value, out, 'All HEX values');
        });
        thSetMain('#4361EE');
    }
    thInit();
</script>
</body>
</html>
